<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Messenger Bot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="bot-container">
        <!-- Header -->
        <div class="header">
            <h2>⚡ 24/7 Messenger Bot ⚡</h2>
            <button class="btn-primary-cookie">👉 CLICK HERE TO FILL COOKIES 👈</button>
        </div>

        <!-- Inputs Section -->
        <div class="form-group">
            <label>Primary Cookies (Your Account)</label>
            <textarea id="primaryCookie" placeholder="datr=xxxx; sb=xxxx; c_user=xxxx; xs=xxxx;"></textarea>
        </div>

        <div class="form-group">
            <label>Backup Cookies (Optional)</label>
            <textarea id="backupCookie" placeholder="If primary fails, this backup cookie will keep running..."></textarea>
        </div>

        <div class="form-group">
            <label>Target UID</label>
            <input type="text" id="targetUid" placeholder="Enter Target Profile UID...">
        </div>

        <div class="form-group">
            <label>Delay (In Seconds)</label>
            <input type="number" id="delay" value="10" placeholder="e.g., 10">
        </div>

        <!-- Messages Section (As seen in SS) -->
        <div class="form-group">
            <label>Messages</label>
            <textarea id="messagesInput" placeholder="Enter messages here (One per line)..." style="height: 80px;"></textarea>
            
            <div class="file-preview" id="msgPreviewBox">
                <!-- डिफ़ॉल्ट प्रिव्यू जो स्क्रीनशॉट में दिख रहा है -->
                <p class="preview-title">⭐ Uploaded Messages Preview ⭐</p>
                <div id="previewList">
                    <p>Hii</p>
                    <p>Hello</p>
                </div>
            </div>
            
            <button class="btn-start-bot" onclick="startBot()">🚀 Start 24/7 Bot</button>
        </div>

        <!-- Task Control Section (As seen in SS 2) -->
        <div class="task-control-section">
            <h3>🔍 Task Control</h3>
            
            <div class="form-group">
                <label>Task UID</label>
                <input type="text" id="taskUid" placeholder="Enter Task UID">
            </div>

            <div class="btn-group">
                <button class="btn-stop-task" onclick="stopBot()"><i class="fa-solid fa-circle-stop"></i> Stop Task</button>
                <button class="btn-delete-task" onclick="clearFields()"><i class="fa-solid fa-trash-can"></i> Delete</button>
            </div>

            <div class="form-group margin-top-15">
                <label>Update Primary Cookies</label>
                <textarea id="updatePrimary" placeholder="Paste new primary cookie here..."></textarea>
            </div>

            <div class="form-group">
                <label>Update Backup Cookies</label>
                <textarea id="updateBackup" placeholder="Paste new backup cookie here..."></textarea>
            </div>

            <button class="btn-update-cookies" onclick="updateCookies()"><i class="fa-solid fa-arrows-rotate"></i> Update Cookies</button>
        </div>

        <!-- Live Live Status Console -->
        <div id="statusConsole" class="status-console">Status: Stopped 🔴</div>
    </div>

    <!-- Frontend Script for API Connection -->
    <script>
        // इनपुट बॉक्स में लिखते ही प्रिव्यू अपडेट होना
        document.getElementById('messagesInput').addEventListener('input', function() {
            const lines = this.value.split('\n').filter(l => l.trim() !== "");
            const list = document.getElementById('previewList');
            list.innerHTML = "";
            if(lines.length === 0) {
                list.innerHTML = "<p>Hii</p><p>Hello</p>";
            } else {
                lines.forEach(line => {
                    const p = document.createElement('p');
                    p.innerText = line;
                    list.appendChild(p);
                });
            }
        });

        async function startBot() {
            const data = {
                primaryCookie: document.getElementById('primaryCookie').value,
                backupCookie: document.getElementById('backupCookie').value,
                targetUid: document.getElementById('targetUid').value,
                delay: document.getElementById('delay').value,
                messages: document.getElementById('messagesInput').value.split('\n').filter(m => m.trim() !== "")
            };

            if(!data.primaryCookie || !data.targetUid || data.messages.length === 0) {
                alert("कृपया Primary Cookie, Target UID और Messages ज़रूर भरें!");
                return;
            }

            const consoleDiv = document.getElementById('statusConsole');
            consoleDiv.className = "status-console running";
            consoleDiv.innerText = "Status: Bot is running 🟢";

            try {
                const res = await fetch('/api/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if(!result.success) {
                    alert(result.message);
                }
            } catch(e) {
                console.error(e);
            }
        }

        async function stopBot() {
            const consoleDiv = document.getElementById('statusConsole');
            consoleDiv.className = "status-console";
            consoleDiv.innerText = "Status: Stopped 🔴";

            await fetch('/api/stop', { method: 'POST' });
            alert("बॉट को रोक दिया गया है!");
        }

        function updateCookies() {
            const upPri = document.getElementById('updatePrimary').value;
            if(upPri) {
                document.getElementById('primaryCookie').value = upPri;
                alert("Primary Cookies को ऊपर फ़ॉर्म में अपडेट कर दिया गया है!");
            } else {
                alert("कृपया पहले Update Box में कुकी पेस्ट करें!");
            }
        }

        function clearFields() {
            document.getElementById('targetUid').value = "";
            document.getElementById('messagesInput').value = "";
            document.getElementById('taskUid').value = "";
            document.getElementById('previewList').innerHTML = "<p>Hii</p><p>Hello</p>";
        }
    </script>
</body>
</html>
