<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi User PETER Bot</title>
    <style>
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        h1 { color: #3498db; font-size: 24px; }
        .status { background: #e74c3c; padding: 10px; margin: 15px 0; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .tab { background: #2c3e50; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; width: 22%; }
        .tab.active { background: #3498db; }
        .panel-section { display: none; }
        .panel-section.active { display: block; }
        label { display: block; text-align: left; margin: 10px 20px 2px 20px; font-size: 13px; color: #bbb; }
        input[type="text"], input[type="file"], input[type="number"] { width: 90%; padding: 10px; margin: 5px 0 15px 0; background: #2c3e50; border: none; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-group { display: flex; justify-content: space-between; margin-top: 15px; padding: 0 20px; }
        .btn { width: 48%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-start { background: #3498db; color: white; }
        .btn-stop { background: #7f8c8d; color: white; }
        .logs-box { background: #000; color: #2ecc71; text-align: left; padding: 15px; font-family: monospace; height: 180px; overflow-y: auto; border-radius: 5px; margin-top: 20px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 MULTI USER LOCKER BOT 🔥</h1>
    <div class="status" id="statusText">Status: Disconnected</div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('main')">Main</div>
        <div class="tab" onclick="switchTab('abuse')">Abuse</div>
        <div class="tab">Settings</div>
        <div class="tab">Cmds</div>
    </div>

    <form id="botForm">
        <!-- MAIN TAB PANEL -->
        <div id="main-panel" class="panel-section active">
            <label>Select your cookie file (txt or json)</label>
            <input type="file" id="cookieFile" accept=".txt,.json">
            
            <label>Target User/Inbox ID</label>
            <input type="text" id="targetId" placeholder="e.g. 61578560554830">
        </div>

        <!-- ABUSE TAB PANEL -->
        <div id="abuse-panel" class="panel-section">
            <label>Select your Abuse Notepad File (.txt)</label>
            <input type="file" id="abuseFile" accept=".txt">

            <label>Speed Delay (In Seconds)</label>
            <input type="number" id="delayTime" value="2" min="1">
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-start" onclick="startBot()">Start Bot</button>
            <button type="button" class="btn btn-stop" onclick="stopBot()">Stop Bot</button>
        </div>
    </form>

    <h3>Bot Logs</h3>
    <div class="logs-box" id="logs">
        [00:00:00] Control panel ready...
    </div>
</div>

<script>
    let botInterval = null;

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel-section').forEach(p => p.classList.remove('active'));
        
        if(tabName === 'main') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('main-panel').classList.add('active');
        } else if(tabName === 'abuse') {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('abuse-panel').classList.add('active');
        }
    }

    function addLog(text) {
        const time = new Date().toLocaleTimeString();
        const logs = document.getElementById('logs');
        logs.innerHTML += `<br>[${time}] ${text}`;
        logs.scrollTop = logs.scrollHeight;
    }

    async function startBot() {
        const cookieFile = document.getElementById('cookieFile').files[0];
        const abuseFile = document.getElementById('abuseFile').files[0];
        const targetId = document.getElementById('targetId').value;
        const delay = document.getElementById('delayTime').value;

        if (!cookieFile) return addLog("Error: Please select a cookie file first.");
        if (!targetId) return addLog("Error: Please enter a Target ID.");
        if (!abuseFile) return addLog("Error: Please select an abuse file under Abuse Tab.");

        document.getElementById('statusText').style.backgroundColor = '#2ecc71';
        document.getElementById('statusText').innerText = 'Status: Connected & Running';
        addLog('Connected to bot server...');
        addLog('Loading cookies and text parameters...');

        // FormData बनाकर बैकएंड सर्वर पर भेजना
        const formData = new FormData();
        formData.append('cookie', cookieFile);
        formData.append('abuse', abuseFile);
        formData.append('targetId', targetId);
        formData.append('delay', delay);

        try {
            const response = await fetch('/api/start-bot', { method: 'POST', body: formData });
            const data = await response.json();
            if(data.success) {
                addLog('Spammer initialized successfully on server!');
            } else {
                addLog('Server Error: ' + data.log);
            }
        } catch (err) {
            addLog('Connection failed with Render server.');
        }
    }

    function stopBot() {
        document.getElementById('statusText').style.backgroundColor = '#e74c3c';
        document.getElementById('statusText').innerText = 'Status: Disconnected';
        addLog('Stopping bot sequence... Disconnected.');
        fetch('/api/stop-bot', { method: 'POST' });
    }
</script>
</body>
</html>
